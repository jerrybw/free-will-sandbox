name: PR Snapshot

# [S3] 每 15 分钟 / PR 检查完成后拉取 open PR 与「PR L1 Check」结论，生成静态快照
#      （public/data/pr-snapshot.json）提交回 main，供 dev-progress.html「PR 状态分区」读取。
#      防循环：快照 commit 带 [skip ci]；pr-check 仅由 pull_request 事件触发，不会被快照
#      commit 触发；workflow_run 触发不受 push paths 限制，链路自洽。
on:
  # PR L1 Check 完成的瞬间立即刷新快照（不受 push paths 限制）
  workflow_run:
    workflows: ["PR L1 Check"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-pr-snapshot.mjs"
      - ".github/workflows/pr-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: pr-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main（内置 GITHUB_TOKEN，persist-credentials 默认开启供后续 push）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate PR snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-pr-snapshot.mjs

      - name: Commit snapshot if changed（原生 git，无三方 action；push 竞态时 rebase 重试）
        run: |
          # git diff --quiet 无法感知 untracked 新文件，改用 git status --porcelain 判定
          if [ -z "$(git status --porcelain -- public/data/pr-snapshot.json)" ]; then
            echo "快照无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/pr-snapshot.json
            git commit -m "chore: update pr snapshot [skip ci]"
            # 多个快照工作流可能并发提交 main，push 被拒时 rebase 重试（最多 3 次）
            for i in 1 2 3; do
              if git push origin main; then
                echo "推送成功（第 $i 次尝试）"
                exit 0
              fi
              echo "::warning::push 被拒（第 $i 次），rebase 远端后重试"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep $((i * 5))
            done
            echo "::error::重试 3 次仍推送失败"
            exit 1
          fi
